name: Aruble Faucet Bot

on:
  workflow_dispatch:
    inputs:
      max_rounds:
        description: 'Claim rounds to run (0 = run until job timeout)'
        required: false
        default: '40'
      claim_wait_min:
        description: 'Min wait (seconds) between claims'
        required: false
        default: '360'
      claim_wait_max:
        description: 'Max wait (seconds) between claims'
        required: false
        default: '420'
  schedule:
    # Every 6 hours. Each run lasts ~5h, so runs do not overlap
    # (prevents duplicate claims while the faucet is on cooldown).
    - cron: '0 */6 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      ARUBLE_EMAIL: ${{ secrets.ARUBLE_EMAIL }}
      ARUBLE_PASSWORD: ${{ secrets.ARUBLE_PASSWORD }}
      PROXY_URL: ${{ secrets.PROXY_URL }}
      MAX_ROUNDS: ${{ inputs.max_rounds || '40' }}
      CLAIM_WAIT_MIN: ${{ inputs.claim_wait_min || '360' }}
      CLAIM_WAIT_MAX: ${{ inputs.claim_wait_max || '420' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the faucet bot
        run: node login.js
